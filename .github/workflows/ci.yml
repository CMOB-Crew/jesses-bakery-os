name: CI

# ---------------------------------------------------------------------
# Until now the only workflow in this repository was keep-warm.yml, which
# curls a list of pages every five minutes. Nothing checked the code.
#
# Fred's stack decision record v1.1.0 (11 August) asked for two things
# that were never built:
#
#   condition 10  secret scanning
#   condition 15  three authorisation tests running in CI
#
# This closes condition 10 and runs every suite that exists. It does NOT
# close condition 15 -- see the note at the bottom of this file. Saying it
# does would be worse than leaving it open.
#
# Everything below already ran, by hand, from the ship scripts. That is
# the actual gap: the checks were real and the discipline was a person
# remembering. A ship script that someone skips once, on a bad morning,
# is not a gate.
# ---------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # --max-warnings 0 on purpose. @next/next/no-img-element is ON in this
      # project and every <img> carries an eslint-disable with a reason -- a
      # warning here is a real decision someone has to make, not noise.
      - name: Lint
        run: npx eslint . --max-warnings 0

      # The six suites that need no database. Each imports the real module
      # through tsx, so a change to the source is a change to what is tested.
      # test-day-grid-seed.mts is deliberately absent: it writes, and it needs
      # a throwaway database rather than a CI runner.
      - name: Store scoring — nothing delivered can never read green
        run: node scripts/test-store-scoring.mjs

      - name: Driver day — a driver is never shown fabricated stops
        run: node scripts/test-driver-day.mjs

      # provision-users.mjs writes to the live authentication system. This does
      # not call it -- it exercises the pure function that decides WHICH
      # accounts --rotate touches. Too generous and Simona is signed out of the
      # account she runs the business from; too mean and a driver keeps a
      # password that is sitting in a Slack channel.
      - name: Password rotation — which accounts it touches
        run: node scripts/test-provision-rotation.mjs

      - name: Coles parser — old and new layouts parse identically
        run: npx tsx scripts/coles-parser-check.ts

      - name: Feed alarm — including the two silent cases
        run: npx tsx scripts/feed-alarm-check.ts

      - name: Harris Farm — week maths
        run: npx tsx scripts/harris-farm-check.ts

      # The one test here that guards whether the site is authenticated at
      # all. Widening the proxy matcher is a one-line change that looks
      # harmless; narrowing it wrongly breaks the scheduled feed pull with an
      # empty body and no error, which is how 9 September went.
      - name: Auth proxy — which paths it runs on
        run: npx tsx scripts/proxy-matcher-check.ts

      # Five wrong dates on five different screens in one week. This is the
      # cheapest thing that notices instead of a person noticing.
      - name: Dates — every one names its clock
        run: npx tsx scripts/dates-name-their-timezone-check.ts

      # These run logs are PUBLIC, and morning-feeds.yml now has an input box
      # a person types into. Both of those are one careless line away from
      # publishing the feed poll secret.
      - name: Workflows — nothing templated reaches the shell
        run: npx tsx scripts/workflows-keep-secrets-out-of-the-shell-check.ts

      # The only suite here that guards money leaving a real customer's
      # account: an unpriced line refuses rather than billing zero, a line
      # with no Xero code refuses rather than guessing, and a refusal never
      # sends a partial invoice.
      - name: Xero invoice — what bills and what refuses
        run: npx tsx scripts/xero-invoice-check.ts

      # A wrong AWS signature fails as 403. So does a wrong key, a wrong
      # secret, a wrong bucket, and a bucket that does not exist -- five
      # different people's problems behind one identical response. This proves
      # the one of the five that is ours, against AWS's own published
      # key-derivation vector, with no credentials and no network.
      - name: R2 — the signature is not the thing that is wrong
        run: npx tsx scripts/test-r2.ts

      # A dummy connection string, not a secret. lib/db.ts throws at module
      # load if DATABASE_URL is unset, and Next evaluates modules while
      # collecting page data, so the build cannot start without one. Nothing
      # connects: every page is force-dynamic, so no query runs at build time.
      - name: Build
        run: npx next build
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          AUTH_ENFORCED: "0"

  # Everything above tests the application's logic. This tests the database:
  # whether it can be built from this repository at all, and whether the
  # authorisation model actually refuses what it claims to refuse.
  #
  # A throwaway Postgres 16 per run. It is dropped and rebuilt from the
  # migrations every time, which is the only way the rebuild stays true --
  # the four-week gap where it silently was not is what this exists to stop.
  db:
    name: Rebuild the database, and condition 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Local to the runner, and the password is the literal string "ci".
      # Not a secret, and deliberately not written as one -- a fake secret
      # teaches people to look past the real ones.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4

      - name: psql
        run: |
          set -euo pipefail
          command -v psql >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          }
          psql --version

      # Fails if any migration cannot apply. Three are skipped by name, each
      # for a stated reason; anything else failing is a defect.
      - name: Can this repository rebuild the database?
        run: bash db/checks/rebuild-from-migrations.sh

      # Rebuilds again from clean, seeds two drivers and a packer, and runs
      # the three tests as the application's own database role.
      - name: Condition 15 — the three authorisation tests
        run: bash db/checks/authorisation-tests.sh

      # The proof-of-delivery audit is the only thing that would ever notice a
      # signature going missing from Storage, which is in no backup. A check
      # like that fails silently when IT breaks -- it goes green, nobody looks,
      # and the thing it was watching rots -- so every answer it can give is
      # asserted against a real Postgres. Last, because it needs the schema the
      # two steps above have just built, including the storage.objects stub.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install (for the audit test)
        working-directory: apps/web
        run: npm ci

      - name: Does the proof-of-delivery audit still detect a loss?
        working-directory: apps/web
        run: npx tsx scripts/test-proof-audit.ts

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: a secret committed and then removed is still a secret

      # Condition 10 of the decision record. This repository is PUBLIC and
      # holds a client's production system. The rule everywhere in this
      # project is that credentials live in Netlify and Supabase and never
      # here -- this is what makes that a gate rather than a habit.
      #
      # THE CLI, NOT gitleaks-action. The action went proprietary at v2.0.0
      # and refuses to run against an organisation-owned repository without a
      # GITLEAKS_LICENSE key. Every CI run from the day it shipped failed in
      # four seconds on that alone, while the real job beside it -- typecheck,
      # lint, seven suites, build -- passed every time. Nobody looked, because
      # a red light that cannot be fixed is a red light people stop reading.
      #
      # The key is free. It is still the wrong dependency: a client's
      # production gate should not rest on a third party's licence server
      # continuing to hand out free keys. The gitleaks CLI is MIT, needs no
      # key, and is the same scanner.
      #
      # Version pinned. The asset NAME is resolved from the release rather
      # than guessed, because that is the part that changes.
      #
      # --redact because these logs are PUBLIC. A scanner that prints the
      # secret it just found has published it.
      - name: gitleaks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: v8.28.0
        run: |
          set -euo pipefail

          json=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/gitleaks/gitleaks/releases/tags/${GITLEAKS_VERSION}")

          # Match on shape, not on an exact filename. x64 and amd64 are both
          # used across projects and the naming is the part most likely to
          # drift; the version is what we actually care about pinning.
          url=$(printf '%s' "$json" | jq -r '
            [ .assets[]?
              | select(.name | test("linux"; "i"))
              | select(.name | test("(x64|amd64)"; "i"))
              | select(.name | test("\\.tar\\.gz$"))
              | .browser_download_url ] | first // empty')

          if [ -z "$url" ]; then
            echo "No linux x64 tarball on the gitleaks ${GITLEAKS_VERSION} release."
            echo "Either the tag is wrong or the asset naming changed. Assets present:"
            printf '%s' "$json" | jq -r '.assets[]?.name // empty'
            printf '%s' "$json" | jq -r '.message // empty'
            exit 1
          fi

          echo "Downloading ${url}"
          curl -sSL "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

          # `git .` scans the full history checked out above. `detect` is the
          # older spelling of this and is deprecated upstream.
          /tmp/gitleaks git . --redact --exit-code 1

# ---------------------------------------------------------------------
# CONDITION 15, and what running it actually found.
#
# It was open from 11 August to 10 September, and it was never blocked on
# writing tests -- it was blocked on there being no database to test
# against. Applying all 89 migrations to an empty Postgres had never been
# tried; when it was, 78 applied. Migrations 003 and 004 were written,
# applied to production and never committed, and the grants for the
# application role existed only on production. Both are reconstructed now
# and the `db` job above rebuilds the database from scratch every run.
#
# On top of that, the three tests:
#
#   1. a driver cannot read another driver's run   NOT MET
#   2. a restricted role cannot write wrongly      met, five ways
#   3. an unauthenticated request returns nothing  met, every table
#
# The first is not a missing policy. There is no driver-to-run assignment
# in this system at all -- every driver is shown every run and picks one.
# No policy can express "another driver's run" against a model with no
# such thing, so closing it means building run assignment first.
#
# The suite reports that as an open gap and asserts it is exactly the size
# it was measured to be, so it cannot widen unnoticed and cannot be
# quietly counted as done either.
# ---------------------------------------------------------------------
