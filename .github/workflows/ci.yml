name: CI

# ---------------------------------------------------------------------
# Until now the only workflow in this repository was keep-warm.yml, which
# curls a list of pages every five minutes. Nothing checked the code.
#
# Fred's stack decision record v1.1.0 (11 August) asked for two things
# that were never built:
#
#   condition 10  secret scanning
#   condition 15  three authorisation tests running in CI
#
# This closes condition 10 and runs every suite that exists. It does NOT
# close condition 15 -- see the note at the bottom of this file. Saying it
# does would be worse than leaving it open.
#
# Everything below already ran, by hand, from the ship scripts. That is
# the actual gap: the checks were real and the discipline was a person
# remembering. A ship script that someone skips once, on a bad morning,
# is not a gate.
# ---------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # --max-warnings 0 on purpose. @next/next/no-img-element is ON in this
      # project and every <img> carries an eslint-disable with a reason -- a
      # warning here is a real decision someone has to make, not noise.
      - name: Lint
        run: npx eslint . --max-warnings 0

      # The five suites that need no database. Each imports the real module
      # through tsx, so a change to the source is a change to what is tested.
      # test-day-grid-seed.mts is deliberately absent: it writes, and it needs
      # a throwaway database rather than a CI runner.
      - name: Store scoring — nothing delivered can never read green
        run: node scripts/test-store-scoring.mjs

      - name: Driver day — a driver is never shown fabricated stops
        run: node scripts/test-driver-day.mjs

      - name: Coles parser — old and new layouts parse identically
        run: npx tsx scripts/coles-parser-check.ts

      - name: Feed alarm — including the two silent cases
        run: npx tsx scripts/feed-alarm-check.ts

      - name: Harris Farm — week maths
        run: npx tsx scripts/harris-farm-check.ts

      # The one test here that guards whether the site is authenticated at
      # all. Widening the proxy matcher is a one-line change that looks
      # harmless; narrowing it wrongly breaks the scheduled feed pull with an
      # empty body and no error, which is how 9 September went.
      - name: Auth proxy — which paths it runs on
        run: npx tsx scripts/proxy-matcher-check.ts

      # The only suite here that guards money leaving a real customer's
      # account: an unpriced line refuses rather than billing zero, a line
      # with no Xero code refuses rather than guessing, and a refusal never
      # sends a partial invoice.
      - name: Xero invoice — what bills and what refuses
        run: npx tsx scripts/xero-invoice-check.ts

      # A dummy connection string, not a secret. lib/db.ts throws at module
      # load if DATABASE_URL is unset, and Next evaluates modules while
      # collecting page data, so the build cannot start without one. Nothing
      # connects: every page is force-dynamic, so no query runs at build time.
      - name: Build
        run: npx next build
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          AUTH_ENFORCED: "0"

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: a secret committed and then removed is still a secret

      # Condition 10 of the decision record. This repository is PUBLIC and
      # holds a client's production system. The rule everywhere in this
      # project is that credentials live in Supabase secrets and never here --
      # this is what makes that a gate rather than a habit.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ---------------------------------------------------------------------
# STILL OPEN: condition 15, three authorisation tests.
#
# The suites above are logic tests. None of them proves that a driver
# cannot read another run's stores, that a packer cannot reach the office
# pages, or that row-level security refuses a write from an unauthenticated
# session. Those need a throwaway database with the migrations applied and
# three sessions with different roles, which is a job of its own.
#
# Written down here rather than quietly counted as done.
# ---------------------------------------------------------------------
