<title>Jesse's Bakery OS Performance Fixes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style id="css">

  --line:#e8dfcf;--line2:#f2ecde;
  --crust:#b0741c;--crust-deep:#8a5714;
  --red:#be5138;--red-t:#9c3520;--red-b:#f3dbd1;
  --amber:#c68a2e;--amber-t:#7c5308;--amber-b:#f5e7cb;
  --green:#5f8f5a;--green-t:#356630;--green-b:#e8efe2;
  --violet:#6f5b9e;--violet-t:#4a3a72;--violet-b:#e9e4f2;

}

    --amber:#d9a04a;--amber-t:#f0cd8b;--amber-b:#3a2c12;
    --green:#7aa874;--green-t:#b7d5b0;--green-b:#1e2c1c;
    --violet:#9d8bc9;--violet-t:#cdc1e6;--violet-b:#2a2338;

:root[data-theme="dark"]{
  --paper:#1a1511;--card:#221c16;--surface:#1f1913;
  --ink:#efe7d8;--ink2:#cdbfa9;--muted:#9b8f7c;--faint:#7a7062;
  --line:#3a3128;--line2:#2c251e;

  --red:#d9705a;--red-t:#f0a795;--red-b:#3b2119;
  --amber:#d9a04a;--amber-t:#f0cd8b;--amber-b:#3a2c12;
  --green:#7aa874;--green-t:#b7d5b0;--green-b:#1e2c1c;
  --violet:#9d8bc9;--violet-t:#cdc1e6;--violet-b:#2a2338;

*{box-sizing:border-box}
html{color-scheme:light dark;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
code{font-family:var(--mono);font-size:.86em;background:var(--code-b);color:var(--code-t);padding:1px 5px;border-radius:4px}
a{color:inherit}

/* ---------- frame ---------- */
.frame{display:grid;grid-template-columns:260px minmax(0,1fr);gap:0;max-width:1240px;margin:0 auto;padding-inline:24px}
@media (max-width:900px){.frame{grid-template-columns:minmax(0,1fr);padding-inline:18px}}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding-block:40px 40px;padding-right:28px;border-right:1px solid var(--line);font-size:13.5px}
@media (max-width:900px){.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:22px 0 18px;overflow:visible}}
.side .brand{font-family:var(--serif);font-size:15px;font-weight:500;color:var(--ink);margin:0 0 4px}
.side .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:22px 0 10px}
.side ol{list-style:none;margin:0;padding:0}
.side li a{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:7px 10px;margin:0 0 2px -10px;border-radius:8px;text-decoration:none;color:var(--ink2);line-height:1.35}
.side li a:hover,.side li a:focus-visible{background:var(--surface);color:var(--ink);outline:none}
.side li a.on{background:var(--card);color:var(--ink);box-shadow:var(--sh);border:1px solid var(--line);margin-left:-11px}
.side li a .n{font-family:var(--serif);font-size:14px;color:var(--faint);min-width:1.2em}
.side li a .t{flex:1;min-width:0}
.side li a .c{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.side li a.opt .t::after{content:"optional";display:inline-block;margin-left:6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--violet-t);background:var(--violet-b);padding:1px 6px;border-radius:999px;vertical-align:1px}
.side .mini{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.side .mini .big{font-family:var(--serif);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.side .mini .big small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400;margin-left:5px}
.bar{height:6px;border-radius:999px;background:var(--line2);margin-top:10px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .d{background:var(--green)}.bar .g{background:var(--amber)}.bar .k2{background:var(--faint)}
.side .saved{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
@media (max-width:900px){.side .k,.side ol,.side .mini{display:none}.side .mini.m{display:block;border:0;padding:0;margin:8px 0 0}}

.main{padding-block:52px 120px;padding-left:56px;min-width:0}
@media (max-width:900px){.main{padding-left:0;padding-block:28px 90px}}
.measure{max-width:var(--measure)}

/* ---------- masthead ---------- */
.mast{margin:0 0 56px;padding-bottom:34px;border-bottom:1px solid var(--ink)}
.kicker{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--crust-deep);font-weight:600;margin:0 0 18px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(38px,5.4vw,60px);line-height:1.02;letter-spacing:-.015em;margin:0 0 20px;text-wrap:balance;font-variation-settings:"opsz" 144;max-width:16ch}
.stand{font-family:var(--serif);font-weight:300;font-size:clamp(19px,2.2vw,23px);line-height:1.4;color:var(--ink2);margin:0 0 22px;max-width:34ch;font-variation-settings:"opsz" 30}
.dateline{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.dateline b{color:var(--ink2);font-weight:500}

/* ---------- reading sections ---------- */
.sec{margin:0 0 64px;scroll-margin-top:24px}
.sec h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.15;letter-spacing:-.01em;margin:0 0 14px;text-wrap:balance}
.sec p{margin:0 0 14px;max-width:var(--measure)}
.sec ol,.sec ul{margin:0 0 14px;padding-left:22px;max-width:var(--measure)}
.sec li{margin:0 0 8px}
.sec li::marker{color:var(--crust)}
.callout{border:1px solid var(--line);border-left:4px solid var(--crust);background:var(--surface);border-radius:0 12px 12px 0;padding:18px 22px;margin:0 0 18px;max-width:var(--measure)}
.callout h3{font-family:var(--serif);font-weight:500;font-size:19px;margin:0 0 6px}
.callout p{margin:0 0 8px}
.callout p:last-child{margin:0}
.filelist{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;margin:12px 0 0;max-width:var(--measure)}
.filelist dt{font-family:var(--mono);font-size:13px;color:var(--crust-deep);white-space:nowrap}
.filelist dd{margin:0;color:var(--ink2)}
@media (max-width:600px){.filelist{grid-template-columns:1fr}.filelist dd{margin-bottom:6px}}

/* ---------- phase opener ---------- */
.phase{margin:0 0 72px;scroll-margin-top:24px}
.ph{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:end;padding-top:26px;border-top:2px solid var(--pc,var(--ink));margin:0 0 22px}
.ph .num{font-family:var(--serif);font-weight:300;font-size:clamp(64px,9vw,104px);line-height:.85;letter-spacing:-.03em;color:var(--pc,var(--ink));font-variation-settings:"opsz" 144}
.ph .txt h2{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.2vw,34px);line-height:1.1;letter-spacing:-.01em;margin:0 0 4px}
.ph .txt .sub{font-family:var(--serif);font-weight:300;font-size:18px;color:var(--ink2);margin:0}
.ph .txt .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.pd{color:var(--ink2);margin:0 0 26px;max-width:var(--measure);font-size:16.5px}
.p1{--pc:var(--red)}.p2{--pc:var(--amber)}.p3{--pc:var(--green)}.p4{--pc:var(--violet)}.p5{--pc:var(--faint)}
.gate{border:2px solid var(--violet);background:var(--violet-b);color:var(--violet-t);border-radius:14px;padding:20px 24px;margin:0 0 26px;max-width:var(--measure)}
.gate h3{font-family:var(--serif);font-weight:500;font-size:20px;margin:0 0 8px;color:inherit}
.gate p{margin:0 0 8px;color:inherit}
.gate p:last-child{margin:0}
.gate b{font-weight:600}

/* ---------- cards ---------- */
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);margin:0 0 18px;overflow:hidden;scroll-margin-top:24px}
.item.done{opacity:.72}.item.skip{opacity:.6}
.ih{display:flex;gap:16px;align-items:flex-start;padding:22px 26px 12px}
.ih .no{font-family:var(--serif);font-size:22px;font-weight:300;color:var(--faint);min-width:34px;line-height:1.2;font-variant-numeric:tabular-nums}
.it{flex:1;min-width:0}
.it h3{font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.25;margin:0 0 8px;letter-spacing:-.005em}
.item.done .it h3{text-decoration:line-through;text-decoration-color:var(--faint)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;line-height:1.5}
.t-speed{background:var(--amber-b);color:var(--amber-t)}
.t-data{background:var(--red-b);color:var(--red-t)}
.t-cost{background:var(--violet-b);color:var(--violet-t)}
.t-eff{background:var(--line2);color:var(--ink2)}
.st{display:flex;gap:4px;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.st button{font:inherit;font-size:12.5px;font-weight:500;padding:5px 11px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.st button[aria-pressed="true"]{color:var(--ink);background:var(--card);box-shadow:var(--sh)}
.st button.sdone[aria-pressed="true"]{background:var(--green-b);color:var(--green-t)}
.st button.sdoing[aria-pressed="true"]{background:var(--amber-b);color:var(--amber-t)}
.st button:focus-visible{outline:2px solid var(--crust);outline-offset:1px}
.ib{padding:4px 26px 24px 76px;display:grid;gap:14px}
@media (max-width:640px){.ih{flex-wrap:wrap;padding:18px 18px 10px}.st{order:3;width:100%;justify-content:space-between}.ib{padding:4px 18px 20px 18px}}
.kv{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px 16px;font-size:15px}
@media (max-width:520px){.kv{grid-template-columns:1fr;gap:4px}}
.kv b{font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;padding-top:4px}
.kv p{margin:0;max-width:60ch;color:var(--ink)}
.where{display:flex;flex-direction:column;gap:4px}
.where code{font-family:var(--mono);font-size:12.5px;background:transparent;padding:0;color:var(--ink2);word-break:break-all}
.where code b{color:var(--crust-deep);font-weight:500}
.ex{display:grid;grid-template-columns:1fr;gap:12px}
.ex div{min-width:0}
.ex span{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 5px}
.ex .after span{color:var(--green-t)}
.ex pre{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.55;background:var(--code-b);color:var(--code-t);padding:12px 14px;border-radius:10px;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;border-left:3px solid var(--line)}
.ex .after pre{border-left-color:var(--green)}
.exnote{font-size:12.5px;color:var(--muted);margin-top:6px}

/* ---------- glossary ---------- */
.gl dl{display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr);gap:12px 20px;margin:0;max-width:var(--measure)}
.gl dt{font-weight:600;font-size:15px}
.gl dd{margin:0;color:var(--ink2);font-size:15px}
@media (max-width:520px){.gl dl{grid-template-columns:1fr}.gl dd{margin-bottom:10px}}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;max-width:var(--measure)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:999px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<script id="data" type="application/json">{"META":{"title":"Jesse’s Bakery OS Performance Fixes","date":"10 September 2026","branch":"ianmuico/taniwha","planFile":"PERFORMANCE-FIXES.md","rulesFile":"CLAUDE.md","skillFile":".claude/skills/perf-fixes/SKILL.md","auditFile":"PERFORMANCE-AUDIT.md"},"GROUPS":[{"n":1,"key":"phase-1","optional":false,"title":"Phase 1","sub":"Do these first","desc":"Biggest effect for the least work. Each one makes every page faster or stops work being lost. None of them change the database."},{"n":2,"key":"phase-2","optional":false,"title":"Phase 2","sub":"Do these next","desc":"Clear, contained changes. Each one touches one file or a small set of files. They change how much work the app does, not what it does."},{"n":3,"key":"phase-3","optional":false,"title":"Phase 3","sub":"When you are already in the file","desc":"Small improvements. Do them while fixing something else nearby."},{"n":4,"key":"phase-4","optional":true,"title":"Phase 4","sub":"Optional — good to know","desc":"Rare situations and things that only matter as the data grows. Read them once. Do them only if the project owner agrees they are worth it.","gate":"Before starting Phase 4, stop and ask the project owner. These are optional. The app works fine without them, and a mistake here costs more than it saves."},{"n":5,"key":"parked","optional":true,"title":"Parked","sub":"Optional — would change the database","desc":"Kept for the record. These would help, but they change how data is stored. They are out of scope unless the project owner decides otherwise.","gate":"Do not start anything in this group without an explicit yes from the project owner. Each one changes the database, needs a migration, and needs a backup plan. If something breaks here, it breaks for everyone."}],"ITEMS":[{"id":"auth-once","group":1,"title":"Check the login once per page, not twice","effort":"Medium change","tags":["speed","cost"],"why":"Every page asks the login server \"is this person signed in?\" twice. Once in the request gate, once again inside the page. Each ask is a network trip and takes about half a second.","fix":"Use the built-in `getClaims()` check in all three places (the request gate, the page-side session read and the token verifier). Separately, a PERSON switches the Supabase project to asymmetric JWT signing keys (dashboard: Settings → JWT Keys). The code change is safe in either order: with the old shared secret `getClaims()` still asks the server, so the speed gain only arrives after the dashboard step. The agent cannot do the dashboard step; make the code change, then tell the project owner the dashboard step is waiting.","where":["apps/web/lib/supabase/proxy.ts:61","apps/web/lib/supabase/server.ts:110","apps/web/lib/auth.ts:41"],"verify":"Locally: `npx tsx scripts/proxy-matcher-check.ts` passes and `npm run build` passes (auth is off locally, so that is all a machine can check). On the preview site, signed in: pages load and the sidebar shows your name; signed out: protected pages redirect to login. After the dashboard step, the `[auth-verify]` line in the Netlify function log (turn on `SLOW_QUERY_MS`) drops from about 500 ms to a few ms.","ex":{"before":"const { data } = await supabase.auth.getUser();\n// network call, ~500 ms","after":"const { data } = await supabase.auth.getClaims();\n// checked locally, ~0 ms"}},{"id":"react-compiler","group":1,"title":"Turn on the React Compiler","effort":"Small change","tags":["speed"],"why":"React often redoes calculations on every click even when nothing changed. Normally you stop that by hand, file by file, with hooks like `useMemo`. The compiler does it for you across all 37 interactive screens.","fix":"Add two lines to `next.config.ts`, rebuild, and click around to confirm nothing looks different.","where":["apps/web/next.config.ts:13"],"verify":"`npm run build` passes. Click through Stores, Packing and a store page; everything behaves the same.","ex":{"before":"const nextConfig = {\n  staticPageGenerationTimeout: 180,\n};","after":"const nextConfig = {\n  staticPageGenerationTimeout: 180,\n  reactCompiler: true,\n  experimental: { turbopackRustReactCompiler: true },\n};"}},{"id":"fonts","group":1,"title":"Load the fonts from our own site","effort":"Small change","tags":["speed"],"why":"The first line of the stylesheet downloads fonts from Google at page load. The browser waits for three separate downloads before it shows any text.","fix":"Use `next/font/google` in the layout file instead. It bundles the fonts with the app. It gives you a CSS variable per font; point the existing `--serif` and `--sans` tokens in `globals.css` at those variables, and put the two font class names on the `<html>` tag.","where":["apps/web/app/globals.css:7","apps/web/app/globals.css:28","apps/web/app/layout.tsx:60"],"verify":"Headings are still Fraunces and body text still Inter. The network tab shows no request to fonts.googleapis.com.","ex":{"before":"/* globals.css */\n@import url(\"https://fonts.googleapis.com/...\");\n:root { --serif: \"Fraunces\", Georgia, serif; }","after":"// layout.tsx\nconst serif = Fraunces({ subsets: [\"latin\"], axes: [\"opsz\"], variable: \"--font-serif\" });\nconst sans  = Inter({ subsets: [\"latin\"], variable: \"--font-sans\" });\n<html className={`${serif.variable} ${sans.variable}`}>\n\n/* globals.css */\n:root { --serif: var(--font-serif), Georgia, serif; }"}},{"id":"floor-outbox","group":1,"title":"Keep packing and driver ticks when the Wi-Fi drops","effort":"Big change","tags":["data"],"why":"On the packing, driver, production and deliveries screens, a tick is sent to the server straight away. If that request fails, the tick still looks saved on screen. It disappears on the next reload. A driver in a dock with no signal loses the delivery.","fix":"Save each change on the device first (a small `localStorage` outbox, one queue per screen and day, keeping only the latest change per store), then send it. When the page opens or the browser fires `online`, resend anything that did not get through. Always check the reply and show \"not saved yet\" while anything is waiting. One shared hook in `lib/` used by all four screens; do not write four copies.","where":["apps/web/components/PackingApp.tsx:142","apps/web/components/PackingApp.tsx:170","apps/web/components/DriverApp.tsx:107","apps/web/components/ProductionBoard.tsx:217","apps/web/components/DeliveriesBoard.tsx:89"],"verify":"With the page open in a browser, stop the local server, tick three lines: the \"not saved yet\" bar appears and the queue has entries. Start the server again and fire `window.dispatchEvent(new Event('online'))` in the console (or wait for the next tap): the bar goes and the queue empties. Reload: the three ticks are there. (A page cannot be reloaded while the server is off, so do not test it that way.)","ex":{"before":"await saveTick(change);\n// if this fails, the change is gone","after":"await outbox.add(change);   // on the device\nconst res = await saveTick(change);\nif (res.ok) await outbox.remove(change);\n// on load + when back online: resend outbox"}},{"id":"packing-merge","group":1,"title":"Stop two iPads erasing each other's packing ticks","effort":"Medium change","tags":["data"],"why":"Saving the packing sheet replaces the whole day's ticks with what that one iPad has. Two packers on different runs, same morning, silently wipe each other's progress.","fix":"Send only the store that changed and merge it into what is already saved. The driver screen already does this with the existing `mergeRunState` helper.","where":["apps/web/app/run-state-actions.ts:154","apps/web/components/PackingApp.tsx:142"],"verify":"Open the packing page in two browsers. Tick a store in each. Reload both; both ticks are present.","ex":{"before":"writeRunState(day, wholeSheet);\n// replaces everything","after":"mergeRunState(day, { [storeId]: ticks });\n// adds one store, keeps the rest"}},{"id":"store-week-cache","group":1,"title":"Reuse the big store table instead of rebuilding it on every page","effort":"Medium change","tags":["speed","cost"],"why":"The main store table takes about a second for the database to compute. It only changes when a sales file loads overnight. Ten different pages ask for it fresh on every visit.","fix":"Wrap the read in `unstable_cache` so it is computed once and reused for an hour. The cached function cannot read cookies, and row-level security needs the signed-in user, so pass the session claims in as an argument and run the query with `runAsUser` inside. Callers get the claims from the already-cached `getSessionClaims()`. Mark it stale at the end of a feed load with `revalidateTag(\"store-week\", \"max\")` from the ingest route. This is an app-side cache and does not change the database.","where":["apps/web/lib/queries.ts:75","apps/web/lib/db.ts:58","apps/web/lib/feeds/ingest.ts:158"],"verify":"Locally (auth is off): build, start the production server, load the Overview twice; the second load is faster and shows the same numbers, and an entry appears in `.next/cache/fetch-cache/`. The signed-in and signed-out parts can only be checked on the preview site with `AUTH_ENFORCED=1`: the same numbers while signed in, nothing while signed out. A feed upload makes the next load show the new numbers.","ex":{"before":"export async function getStoreWeek() {\n  return sql`select * from v_store_week`;\n}\n// page: getStoreWeek()","after":"export const getStoreWeek = unstable_cache(\n  (claims) => runAsUser(claims, tx => tx`select * from v_store_week`),\n  [\"store-week\"],\n  { revalidate: 3600, tags: [\"store-week\"] });\n// page: getStoreWeek(await getSessionClaims())\n// ingest route, after a load: revalidateTag(\"store-week\", \"max\")"}},{"id":"store-page-trips","group":1,"title":"Store page: 18 database trips, could be about 8","effort":"Medium change","tags":["speed"],"why":"Each trip to the database takes about 0.13 seconds and they run one after another. Four of the 18 read the same settings row. Three read the same store row. One reads every store's revenue just to use one line.","fix":"Read the settings row once and the store row once. Pass the store id to the revenue read. Remove `getStoreById` because that row is already in the full list.","where":["apps/web/app/store/[id]/page.tsx:91","apps/web/lib/queries.ts:794","apps/web/lib/queries.ts:805","apps/web/lib/queries.ts:862","apps/web/lib/queries.ts:1021","apps/web/lib/queries.ts:1651"],"verify":"A store page shows the same numbers as before: service level, last visit, shelf cap, photo, address, revenue.","ex":{"before":"getStoreServiceLevel(id)  // trip 1\ngetStoreLastVisit(id)     // trip 2\ngetStoreShelfCap(id)      // trip 3\ngetStorePhoto(id)         // trip 4","after":"getStoreSettings(id)\n// one trip: select service_level, last_visit_on,\n//   shelf_cap, no_cap, photo_url ... where store_id = id"}},{"id":"photo-route","group":1,"title":"Stop pasting the store photo into the page","effort":"Medium change","tags":["speed","cost"],"why":"The storefront photo is up to 1.4 MB and is written into the page twice on every store view. On a phone that is a heavy download every single time.","fix":"Serve the photo from its own small URL with caching headers, and tell the page only whether a photo exists. The database stays as it is.","where":["apps/web/app/store/[id]/page.tsx:139","apps/web/components/StoreProfile.tsx:411"],"verify":"A store with a photo still shows it. View the page source: no long base64 string inside it.","ex":{"before":"<StoreProfile photo={hugeBase64String} />","after":"<StoreProfile hasPhoto={true} />\n// in the component:\n<img src={`/api/store/${id}/photo`} />"}},{"id":"actions-tx","group":1,"title":"Bundle each save into one database request","effort":"Medium change","tags":["data","speed"],"why":"Several save buttons run five or more separate database statements with nothing holding them together. Each statement costs extra trips. If one fails halfway, the data is left half-updated.","fix":"Wrap the body of each save in `withUser()`, which already exists. One bundle, one set of trips, and either all of it saves or none of it does. (When the login flag `AUTH_ENFORCED` is off, `withUser` simply runs the code as before, so this is safe in both modes.)","where":["apps/web/app/store/actions.ts:262","apps/web/app/store/actions.ts:453","apps/web/app/map/actions.ts:55","apps/web/app/driver-proof-actions.ts:56","apps/web/app/new-store/actions.ts:92","apps/web/app/new-product/actions.ts:96"],"verify":"Each save still works from the screen that uses it. Saving a run's days updates the map and the stores.","ex":{"before":"await sql`update runs ...`;\nfor (const d of days) await sql`update stores ...`;","after":"await withUser(async () => {\n  await sql`update runs ...`;\n  for (const d of days) await sql`update stores ...`;\n});"}},{"id":"ref-cache","group":1,"title":"Cache the two slow numbers that change once a day","effort":"Small change","tags":["speed","cost"],"why":"The weekday sales curve scans 91 days of sales and runs on four pages. Feed health runs on every page because it powers the alarm bar, then again on the feeds page. Both only change when a file loads overnight.","fix":"Wrap both in `unstable_cache` with a one-hour life, using the same claims-as-argument recipe as the store table card. Cast any date columns to text in the SQL (`::text`) so the cached copy looks the same as a fresh one. Mark them stale from the feed ingest route with `revalidateTag(tag, \"max\")`. Also wrap `getFeedHealth` in React `cache()` so the alarm bar and the feeds page share one read per request.","where":["apps/web/lib/queries.ts:2348","apps/web/lib/queries.ts:930","apps/web/components/FeedAlarm.tsx:46"],"verify":"`npx tsx scripts/feed-alarm-check.ts` passes. Locally the feeds page and the packing sheet render the same as before (feed health dates read correctly, standing orders still split by weekday). The alarm bar itself only shows when a feed is late, which local data usually is not; the preview site with a stale feed is the place to see it.","ex":{"before":"export async function getWeekdayShape() {\n  return sql`... 91 days of sales ...`;\n}","after":"export const getWeekdayShape = unstable_cache(\n  (claims) => runAsUser(claims, tx => tx`... 91 days of sales ...`),\n  [\"weekday-shape\"], { revalidate: 3600, tags: [\"weekday-shape\"] });\n\nexport const getFeedHealth = cache(async (claims) => cachedFeedHealth(claims));"}},{"id":"layout-tx","group":1,"title":"The page frame should not run its own database requests","effort":"Medium change","tags":["speed"],"why":"Before any page draws, the shared frame runs the role lookup and the feed alarm as two separate bundles. Then the page opens a third. That is eight extra trips on every route.","fix":"Cache the role per person for five minutes with `unstable_cache`, passing the claims in and keeping the existing `runAsUser` call inside. The role rarely changes, and a five-minute delay after an admin changes it is acceptable. Feed health is covered by the card above.","where":["apps/web/lib/app-role.ts:36","apps/web/components/FeedAlarm.tsx:46"],"verify":"Build passes. Roles are only enforced with `AUTH_ENFORCED=1`, so this is checked on the preview site: a driver account still sees only the driver screen, an admin still sees the full sidebar, and a role changed in the admin table shows within five minutes.","ex":{"before":"// layout: its own bundle on every request\nexport const getAppRole = cache(async () => {\n  const claims = await getSessionClaims();\n  return runAsUser(claims, tx => tx`select public.current_app_role()`);\n});","after":"const roleFor = unstable_cache(\n  (claims) => runAsUser(claims, tx => tx`select public.current_app_role()`),\n  [\"app-role\"], { revalidate: 300 });\nexport const getAppRole = cache(async () => roleFor(await getSessionClaims()));"}},{"id":"accuracy","group":1,"title":"Accuracy page recomputes six months of sales on every visit","effort":"Medium change","tags":["speed","cost"],"why":"Two very large queries run one after the other, then a calculation over every store and product. The answer only changes once a day.","fix":"Cache the whole computed result (not the rows) for an hour with `unstable_cache`, using the claims-as-argument recipe from the store table card, and mark it stale from the feed ingest. Do not try to run the two queries at the same time: inside one bundle they share one connection, so `Promise.all` gains nothing (see `CLAUDE.md`, Database access).","where":["apps/web/lib/queries.ts:2173","apps/web/app/accuracy/page.tsx:15"],"verify":"The accuracy page shows the same scores. The second visit within an hour is much faster.","ex":{"before":"export async function getForecastAccuracy() {\n  const stores = await sql`...`;\n  const products = await sql`...`;\n  return compute(stores, products);\n}","after":"const cached = unstable_cache(\n  (claims) => runAsUser(claims, tx => compute(tx)),\n  [\"forecast-accuracy\"], { revalidate: 3600, tags: [\"forecast-accuracy\"] });\nexport const getForecastAccuracy = async () =>\n  cached(await getSessionClaims());"}},{"id":"forecast-n1","group":1,"title":"Forecast engine: 15,000 queries per run, could be 3","effort":"Medium change","tags":["cost"],"why":"For every store and product, the engine runs three separate queries inside a loop. That is why the nightly run is slow and heavy on the database.","fix":"Run three queries once at the start that return everything, then look values up in Python dictionaries inside the loop.","where":["services/forecast/app.py:113","services/forecast/app.py:119"],"verify":"`app.py` has no dry-run mode today, so add one first as part of this card: a `dry_run` field on `PlanRequest` that computes and returns the rows and skips the write. Copy that version of `app.py` aside as the baseline before changing the loop. In a Python venv (`pip install -r services/forecast/requirements.txt`, `DATABASE_URL` pointing at the local database), call `build_plan` on the baseline and on the new module with `dry_run` for a few target dates; the row lists must be identical. Count the `execute` calls in each: on a trial run against local data, about 1,766 per run became 5.","ex":{"before":"for r in combos:\n    stats = weekday_stats(cur, r.store, r.product)\n    uplift = event_uplift(cur, target, r.state)","after":"stats_by = load_all_stats(cur)     # once\nuplift_by = load_all_uplift(cur)   # once\nfor r in combos:\n    stats = stats_by[(r.store, r.product)]"}},{"id":"with-user-pages","group":2,"title":"Wrap the seven simple pages the same way as the Overview","effort":"Small change","tags":["speed"],"why":"These pages read the database without the `withUser()` wrapper. Each statement then opens and closes its own bundle. Two of them run three at once on three connections.","fix":"Wrap the data reads in `withUser(() => …)` exactly like `app/page.tsx` does.","where":["apps/web/app/products/page.tsx:18","apps/web/app/region/[name]/page.tsx:21","apps/web/app/benchmarks/page.tsx:15","apps/web/app/opportunities/page.tsx:15","apps/web/app/lost-sales/page.tsx:15","apps/web/app/archive/page.tsx:15","apps/web/app/accuracy/page.tsx:15"],"verify":"Each of the seven pages still shows its data when signed in.","ex":{"before":"const data = await getOpportunities();","after":"const data = await withUser(() => getOpportunities());"}},{"id":"invoice-week","group":2,"title":"Xero invoices may start on Sunday instead of Monday","effort":"Small change","tags":["data"],"why":"The week start is built as local midnight and then converted to universal time text. On an Australian browser that moves it back one day.","fix":"Work out the Monday on the server, next to where `today` is already computed, and pass it down.","where":["apps/web/components/StandingOrderPanel.tsx:78"],"verify":"Draft an invoice on a Wednesday. The period start shown in Xero is that week's Monday.","ex":{"before":"const d = new Date(`${today}T00:00:00`);\nd.setDate(d.getDate() - back);\nreturn d.toISOString().slice(0, 10); // shifts a day","after":"// server page: same Sydney helper as `today`\nconst periodStart = sydneyMonday(today);\n<StandingOrderPanel periodStart={periodStart} />"}},{"id":"no-refresh","group":2,"title":"Stop reloading the whole store page after every small save","effort":"Medium change","tags":["speed"],"why":"After saving a shelf cap, a visit date, a price, or one cell of the standing order, the code reloads the page. That re-runs all 18 database reads to show a value the screen already has. Tabbing across five day boxes fires five full reloads.","fix":"Keep the saved value in the screen's own state and remove the reload. Keep the reload only where something else on the page really changes: adding a line, removing a line that has nothing to fall back to, the first day written into a day grid (the server seeds the other days), saving a store's delivery week (other panels read it) and saving a run's days (its stores change). Where a reload stays, still show the saved value from local state so nothing flashes back.","where":["apps/web/components/StoreProfile.tsx:219","apps/web/components/StandingOrderPanel.tsx:157","apps/web/components/StoreDeliveryPanel.tsx:107","apps/web/components/ProductsList.tsx:311","apps/web/components/RunBoard.tsx:168"],"verify":"Change a shelf cap, reload the page by hand: the new value is there. No spinner after each save.","ex":{"before":"const res = await setShelfCap(id, cap);\nif (res.ok) router.refresh();  // 18 reads again","after":"const res = await setShelfCap(id, cap);\nif (res.ok) setCap(cap);       // update the screen"}},{"id":"deferred-search","group":2,"title":"Keep typing smooth in the search boxes","effort":"Small change","tags":["speed"],"why":"Each key press immediately filters and redraws up to 265 rows. Typing can stutter on a slower laptop or tablet.","fix":"Let the box update instantly and the list catch up a moment later with `useDeferredValue`. One line per file.","where":["apps/web/components/StoresList.tsx:92","apps/web/components/ProductionBoard.tsx:467","apps/web/components/DeliveriesBoard.tsx:353","apps/web/components/NewProductSetup.tsx:99"],"verify":"Type quickly in the Stores search box. Letters appear instantly; the list follows.","ex":{"before":"const rows = stores.filter(s => match(s, q));","after":"const dq = useDeferredValue(q);\nconst rows = stores.filter(s => match(s, dq));"}},{"id":"usememo","group":2,"title":"Remember heavy calculations between clicks","effort":"Small change","tags":["speed"],"why":"Totals, medians and groupings over all 265 stores are rebuilt on every click, even when the inputs did not change.","fix":"Wrap each calculation in `useMemo` with its inputs listed. If you turn on the React Compiler first (Phase 1), most of these are handled for you.","where":["apps/web/components/TodayDashboard.tsx:65","apps/web/components/TodayDashboard.tsx:90","apps/web/components/StoresList.tsx:34","apps/web/components/DeliveriesBoard.tsx:138","apps/web/components/SeasonalityCalendar.tsx:139"],"verify":"The Overview tiles show the same numbers. Clicking a band filter feels instant.","ex":{"before":"const totals = rows.reduce(sum, 0); // every render","after":"const totals = useMemo(\n  () => rows.reduce(sum, 0), [rows]); // only when rows change"}},{"id":"memo-rows","group":2,"title":"Give long lists their own row component","effort":"Medium change","tags":["speed"],"why":"Each row is written inline inside the big screen, so ticking one packing line redraws all 27 store rows. Typing one quantity redraws all 70 product rows.","fix":"Move the row into its own small component wrapped in `memo()`. The React Compiler covers most of this too.","where":["apps/web/components/PackingApp.tsx:341","apps/web/components/ProductionBoard.tsx:514","apps/web/components/DeliveriesBoard.tsx:404","apps/web/components/StoresList.tsx:299","apps/web/components/NewProductSetup.tsx:277","apps/web/components/SeasonalityCalendar.tsx:326"],"verify":"Ticking a packing line no longer makes the whole list flicker on a tablet.","ex":{"before":"{stores.map(s => (\n  <tr onClick={() => open(s.id)}>...<\/tr>\n))}","after":"const StoreRow = memo(function StoreRow({ s, onOpen }) {\n  return <tr onClick={() => onOpen(s.id)}>...<\/tr>;\n});"}},{"id":"content-vis","group":2,"title":"Free speed-up for long tables","effort":"Small change","tags":["speed"],"why":"The stores table, the delivery sheet (about 10,000 inputs) and the new-product store list draw every row, even the ones off screen.","fix":"One CSS rule tells the browser to skip rows that are not visible. No logic changes.","where":["apps/web/app/globals.css:186","apps/web/components/StoresList.tsx:290","apps/web/components/DeliverySheet.tsx:127","apps/web/components/NewProductSetup.tsx:378"],"verify":"Scrolling the delivery sheet is smoother. Printing it still shows every row.","ex":{"before":".tablewrap tbody tr { }","after":".tablewrap tbody tr {\n  content-visibility: auto;\n  contain-intrinsic-block-size: auto 48px;\n}"}},{"id":"sheet-totals","group":2,"title":"Delivery sheet: every total recalculated on every key press","effort":"Medium change","tags":["speed"],"why":"Row and column totals are recomputed from scratch and every cell is redrawn each time a number is typed. That is roughly 40,000 additions per key press.","fix":"Remember the totals with `useMemo`, give each row its own `memo()` component, and use a CSS animation for the cell flash instead of state.","where":["apps/web/components/DeliverySheet.tsx:91","apps/web/components/DeliverySheet.tsx:68"],"verify":"Typing in a cell updates its row and column totals correctly, with no lag.","ex":{"before":"const colTotal = p => stores.reduce(...);\n// called for every column, every render","after":"const colTotals = useMemo(\n  () => products.map(p => stores.reduce(...)),\n  [cells, products, stores]);"}},{"id":"map-move","group":2,"title":"Map page: stop recalculating on every mouse move","effort":"Small change","tags":["speed"],"why":"Moving the mouse over the map re-sorts, regroups and re-lays out all 265 dots before showing the tooltip.","fix":"Remember the layout with `useMemo` and only update the tooltip on the next screen frame.","where":["apps/web/components/NetworkMap.tsx:159","apps/web/components/NetworkMap.tsx:155"],"verify":"Hovering across the map shows tooltips smoothly.","ex":{"before":"onMouseMove={e => setTip(findDot(e))}","after":"onMouseMove={e => {\n  cancelAnimationFrame(raf.current);\n  raf.current = requestAnimationFrame(() => setTip(findDot(e)));\n}}"}},{"id":"deliveries-detail","group":2,"title":"Deliveries page sends 2,500 detail rows nobody sees","effort":"Medium change","tags":["speed"],"why":"Every store's product lines are sent to the browser on load but only shown when a row is expanded. One field is never used at all.","fix":"Remove the unused field, and load a store's lines only when it is expanded.","where":["apps/web/components/DeliveriesBoard.tsx:27","apps/web/app/deliveries/page.tsx:20"],"verify":"Expanding a store still shows its product lines.","ex":{"before":"<DeliveriesBoard detail={allLines} />","after":"// on expand:\nconst lines = await getStoreLines(storeId);"}},{"id":"packing-tx","group":2,"title":"Packing page opens three bundles, one is enough","effort":"Small change","tags":["speed"],"why":"Two reads run in their own `withUser` calls and the main read in a third. Each extra bundle is three extra trips.","fix":"Put all the reads inside one `withUser` call.","where":["apps/web/app/packing/page.tsx:48","apps/web/app/packing/page.tsx:61"],"verify":"The packing page still opens on today's date and lists today's runs.","ex":{"before":"withUser(() => getPackingDays());\nwithUser(() => getWeekdayShape());\nwithUser(() => getPackingRuns(day));","after":"withUser(async () => {\n  const [days, shape] = await Promise.all([...]);\n  const day = pick(days);\n  return getPackingRuns(day, shape);\n});"}},{"id":"reference-lists","group":2,"title":"Cache the reference lists","effort":"Small change","tags":["speed","cost"],"why":"Run lists, product lists, tray sizes, settings, region names and addresses are re-read on every page view. They change a few times a month.","fix":"Wrap each helper in `unstable_cache` with a five-minute life, using the claims-as-argument recipe from the store table card. Use a time limit rather than clearing from the save button: clearing a tag from a server action can make the browser re-request every page, which is the storm described in `app/map/actions.ts`. Five minutes of staleness on a setup list is fine.","where":["apps/web/lib/queries.ts:844","apps/web/lib/queries.ts:283","apps/web/lib/queries.ts:1034","apps/web/lib/queries.ts:96","apps/web/lib/queries.ts:3132","apps/web/lib/queries.ts:2969","apps/web/lib/queries.ts:3118"],"verify":"Create a new run. It appears in the run dropdowns within five minutes (immediately on the page that created it, which already refreshes).","ex":{"before":"export async function getRuns() { return sql`...`; }","after":"export const getRuns = unstable_cache(\n  (claims) => runAsUser(claims, tx => tx`...`),\n  [\"runs\"], { revalidate: 300 });\n// page: getRuns(await getSessionClaims())"}},{"id":"overview-trips","group":2,"title":"Overview: 13 database trips, could be about 8","effort":"Medium change","tags":["speed"],"why":"Several one-row reads (network totals, as-of date, engine health) and three store lookups run as separate statements, one after another.","fix":"Combine the one-row reads into one statement (`row_to_json` scalar subqueries) and the three store lookups into one statement that returns three `json_agg` arrays. Same data, four fewer trips: measured, thirteen statements became nine.","where":["apps/web/app/page.tsx:58","apps/web/app/stores/page.tsx:19"],"verify":"The Overview shows the same headline, tiles and run cards as before.","ex":{"before":"getNetwork(), getAsOf(), getEngineHealth()\n// three trips","after":"getOverviewHeader()\n// select (select ...) as net, (select ...) as asof, ..."}},{"id":"copy-ingest","group":2,"title":"Feed upload: send rows in one go instead of 51 batches","effort":"Medium change","tags":["speed"],"why":"A 100,000-row Woolworths file is inserted in 2,000-row chunks, each a separate trip. That is about 6.6 seconds of pure waiting out of a 60-second limit.","fix":"Raise the chunk size to 8,000: the insert has 8 columns, so that is 64,000 values per statement, under Postgres's 65,535-parameter limit, and a 100,000-row file becomes 13 statements. Do NOT switch to `COPY ... FROM STDIN`: it is a different protocol path through the pooled connection and cannot be tested locally against the pooler, so it is not a fix this plan offers.","where":["apps/web/lib/feeds/ingest.ts:121"],"verify":"There is no test file in the repo. Make one with `npx tsx scripts/make-coles-fixture.ts`, start the local server and POST it as multipart `file` to `/api/feeds/coles`; the JSON reply shows the same rows loaded and rejected before and after. Note: `scripts/coles-parser-check.ts` fails with an exceljs streaming-reader error on an untouched checkout on Node 22.23.1 and Node 24 (see `netlify.toml`); that failure is pre-existing and is not a check of this card.","ex":{"before":"const CHUNK = 2000;\nfor (...) await sql`insert into feed_staging ...`;","after":"const CHUNK = 8000;  // 8 columns x 8,000 = 64,000 values\nfor (...) await sql`insert into feed_staging ...`;"}},{"id":"parse-outside","group":2,"title":"Read the spreadsheet before opening the database bundle","effort":"Medium change","tags":["speed","cost"],"why":"The four-second spreadsheet parse happens while a database connection sits open and idle. That ties up the shared pool for everyone else.","fix":"Split the work into \"parse\" and \"write\". Only the write part runs inside the bundle. Move the file cleanup to `after()` so it does not delay the reply.","where":["apps/web/lib/feeds/ingest.ts:95","apps/web/app/api/feeds/[retailer]/route.ts:66","apps/web/app/api/feeds/[retailer]/route.ts:129"],"verify":"Build passes and `npx tsx scripts/harris-farm-check.ts` passes. To load a file locally, make a fixture with `npx tsx scripts/make-coles-fixture.ts` and POST it to `/api/feeds/coles` on the local server; the counts match the run before the change. The Coles parser check script fails on unchanged code on Node 22.23.1 and Node 24 (see the card above), so it is not a check here.","ex":{"before":"await runAsUser(claims, async tx => {\n  const rows = await parse(file); // 4 s, holds a connection\n  await write(tx, rows);\n});","after":"const rows = await parse(file);  // no connection\nawait runAsUser(claims, tx => write(tx, rows));\nafter(() => storage.remove(path));"}},{"id":"driver-addresses","group":2,"title":"Driver page sends 265 addresses for about 25 stops","effort":"Small change","tags":["speed"],"why":"The whole address book is fetched and sent to the phone. Only today's stops are read.","fix":"Filter the addresses to the stores on today's runs before passing them down.","where":["apps/web/app/driver/page.tsx:21"],"verify":"Every stop on the driver screen still shows its address.","ex":{"before":"<DriverApp addresses={allAddresses} />","after":"const ids = new Set(runs.flatMap(r => r.stores.map(s => s.store_id)));\nconst mine = pick(allAddresses, ids);\n<DriverApp addresses={mine} />"}},{"id":"proof-timeout","group":2,"title":"Delivery proof uploads have no time limit","effort":"Small change","tags":["data"],"why":"On one bar of signal a stuck upload never fails, so the driver never sees the \"not stored\" message and the proof is silently lost.","fix":"Give each upload a 20-second limit and treat a timeout as \"no signal\".","where":["apps/web/lib/driver-proof.ts:63"],"verify":"Throttle the network to offline mid-upload. Within 20 seconds the screen says the proof was not stored.","ex":{"before":"await fetch(url, { method: \"PUT\", body });","after":"await fetch(url, { method: \"PUT\", body,\n  signal: AbortSignal.timeout(20000) });"}},{"id":"proof-actions","group":2,"title":"One delivery = six database bundles across three requests","effort":"Small change","tags":["speed","data"],"why":"Recording a delivery, then a photo, then a signature each run two statements with no wrapper. The delivery row is written again each time.","fix":"Wrap each action in `withUser` and return the delivery id from the first call so the others can reuse it.","where":["apps/web/app/driver-proof-actions.ts:56","apps/web/app/driver-proof-actions.ts:182"],"verify":"Record a delivery with a photo and a signature. Both appear on the store's delivery history.","ex":{"before":"await sql`insert into deliveries ...`;\nawait sql`insert into delivery_photos ...`;","after":"await withUser(async () => {\n  const [d] = await sql`insert into deliveries ... returning id`;\n  await sql`insert into delivery_photos (delivery_id ...) values (${d.id} ...)`;\n});"}},{"id":"product-page","group":2,"title":"Product page reads the store table twice","effort":"Small change","tags":["speed"],"why":"Two queries both join the heavy store table for the same product.","fix":"Use one query that returns the per-store rows, and add up the header numbers in JavaScript.","where":["apps/web/app/product/[id]/page.tsx:18","apps/web/lib/queries.ts:454"],"verify":"A product page shows the same header totals and store list.","ex":{"before":"const [product, stores] = await Promise.all([\n  getProductById(id), getProductStores(id)]);","after":"const stores = await getProductStores(id);\nconst product = summarise(stores); // sums in JS"}},{"id":"toast-timers","group":3,"title":"Cancel the toast timer when a screen closes","effort":"Small change","tags":["speed"],"why":"Several screens start a timer to hide a message and never cancel it if the screen closes first. Harmless today, a warning in the browser console.","fix":"Return a cleanup from a `useEffect` that cancels the timer.","where":["apps/web/components/PackingApp.tsx:200","apps/web/components/ProductionBoard.tsx:260","apps/web/components/DeliveriesBoard.tsx:180","apps/web/components/StoreProfile.tsx:177","apps/web/components/SeasonalityCalendar.tsx:271","apps/web/components/SettingsPanel.tsx:145"],"verify":"Trigger a toast, navigate away immediately. No console warning.","ex":{"before":"toastTimer = setTimeout(hide, 3600);","after":"useEffect(() => () => clearTimeout(toastTimer), []);"}},{"id":"inline-style","group":3,"title":"Move big style blocks out of the components","effort":"Small change","tags":["speed"],"why":"Some screens carry 80 to 160 lines of CSS inside the component. It is rebuilt as text on every render and sent with the page each time.","fix":"Move the block into `globals.css`, or hoist it to a constant outside the component as `ForecastAccuracy` already does.","where":["apps/web/components/TodayDashboard.tsx:421","apps/web/components/StoreProfile.tsx:777","apps/web/components/SeasonalityCalendar.tsx:478","apps/web/components/SettingsPanel.tsx:349","apps/web/app/login/page.tsx:92"],"verify":"Each screen looks identical before and after.","ex":{"before":"return <>...<style>{`.big { ... }`}<\/style><\/>;","after":"const CSS = `.big { ... }`; // outside the component\nreturn <>...<style>{CSS}<\/style><\/>;"}},{"id":"formatters","group":3,"title":"Build date and number formatters once","effort":"Small change","tags":["speed"],"why":"A few files create a new date or number formatter for every row or every request. Creating one is slow; using one is fast.","fix":"Create the formatter once at the top of the file and reuse it.","where":["apps/web/app/store/[id]/page.tsx:130","apps/web/app/store/actions.ts:156","apps/web/app/packing/page.tsx:32","apps/web/components/StoreProfile.tsx:12"],"verify":"Dates still show in Sydney time with the same wording.","ex":{"before":"function fmt(d) {\n  return new Intl.DateTimeFormat(\"en-AU\", opts).format(d);\n}","after":"const DF = new Intl.DateTimeFormat(\"en-AU\", opts);\nfunction fmt(d) { return DF.format(d); }"}},{"id":"dead-code","group":3,"title":"Remove code nothing uses","effort":"Small change","tags":["speed"],"why":"Three query helpers have no callers, a few CSS blocks match no component, and one stylesheet is a template leftover.","fix":"Delete them. Less to read next time.","where":["apps/web/lib/queries.ts:106","apps/web/lib/queries.ts:1111","apps/web/lib/queries.ts:1303","apps/web/app/globals.css:110","apps/web/app/page.module.css:1"],"verify":"`npm run build` and `npm run lint` pass.","ex":{"before":"export async function getWasteTrend() { ... } // no callers","after":"// deleted"}},{"id":"retailer-badge","group":3,"title":"Retailer badges: plain image tag instead of next/image","effort":"Small change","tags":["speed"],"why":"The special image component is used with optimisation turned off, so it adds work on 265 rows for no benefit.","fix":"Use a normal image tag with lazy loading.","where":["apps/web/components/RetailerBadge.tsx:67"],"verify":"Retailer logos still show in the Stores table.","ex":{"before":"<Image src={src} width={18} height={18} unoptimized />","after":"<img src={src} width={18} height={18} loading=\"lazy\" alt=\"\" />"}},{"id":"trim-props","group":3,"title":"Do not send data the screen never reads","effort":"Small change","tags":["speed"],"why":"A few pages pass whole database rows to the browser when the screen reads only some of the fields: the benchmarks page sends every store's benchmark row and the screen never reads it, the new-product form reads a product's name and three article numbers out of nine fields, the delivery sheet reads four fields of each plan row, and the region page's list reads thirteen of a store row's seventeen fields (a small trim).","fix":"Map the rows to just the fields the screen uses before passing them down, and narrow the component's prop type to match (`Pick<...>` or `Omit<...>`) so the compiler catches a field the screen still needs.","where":["apps/web/app/benchmarks/page.tsx:22","apps/web/app/region/[name]/page.tsx:78","apps/web/app/new-product/page.tsx:13","apps/web/components/DeliverySheet.tsx:27"],"verify":"Each page renders the same.","ex":{"before":"<StoreBenchmarks data={data} /> // includes data.rows, unused","after":"const { rows, ...rest } = data;\n<StoreBenchmarks data={rest} />"}},{"id":"maps-not-find","group":3,"title":"Use a lookup map instead of searching a list inside a loop","effort":"Small change","tags":["speed"],"why":"Searching one list inside a loop over another list gets slow once both have hundreds of entries.","fix":"Build a `Map` keyed by id once, then look things up directly.","where":["apps/web/components/StoreProfile.tsx:148","apps/web/lib/queries.ts:2653","apps/web/components/NewProductSetup.tsx:90"],"verify":"Same rows, same order.","ex":{"before":"for (const row of rows) {\n  const store = stores.find(s => s.id === row.store_id);\n}","after":"const byId = new Map(stores.map(s => [s.id, s]));\nfor (const row of rows) {\n  const store = byId.get(row.store_id);\n}"}},{"id":"xero-tenant","group":3,"title":"Xero account id is fetched before every invoice","effort":"Small change","tags":["speed"],"why":"It never changes, yet there is an extra call to Xero each time.","fix":"Remember it after the first successful call.","where":["apps/web/app/store/xero-actions.ts:67","apps/web/lib/xero.ts:151"],"verify":"Drafting an invoice still works.","ex":{"before":"const tenantId = await xeroTenantId(token); // every time","after":"let cachedTenant = null;\nconst tenantId = cachedTenant ??= await xeroTenantId(token);"}},{"id":"ask-queries","group":3,"title":"Assistant: two queries where one would do","effort":"Small change","tags":["speed"],"why":"Three answers run two statements each, and matching a store name reads the whole store table.","fix":"Merge each pair into one statement. Match a name against a small list of store names instead of the full table.","where":["apps/web/lib/ask.ts:223","apps/web/lib/ask.ts:441","apps/web/lib/ask.ts:469","apps/web/lib/ask.ts:487"],"verify":"Ask \"worst waste this week\" and \"how is Coles Bondi\". Same answers.","ex":{"before":"const top = await sql`select ... limit 5`;\nconst net = await sql`select avg(...)`;","after":"const rows = await sql`select ..., (select avg(...)) as net\n  ... limit 5`;"}},{"id":"pool","group":3,"title":"Connection pool settings for serverless","effort":"Small change","tags":["cost"],"why":"Eight connections per server instance is more than a request uses (one). There is no connect timeout, so a stalled connection can eat the whole 60-second budget.","fix":"Three settings in `lib/db.ts`.","where":["apps/web/lib/db.ts:24","apps/web/lib/db.ts:25"],"verify":"Pages load as before. A deliberately wrong database URL now fails within 10 seconds.","ex":{"before":"postgres(url, { max: 8, idle_timeout: 20 })","after":"postgres(url, { max: 4, idle_timeout: 20,\n  connect_timeout: 10, max_lifetime: 300 })"}},{"id":"grain","group":3,"title":"Paper-grain background slows scrolling on phones","effort":"Small change","tags":["speed"],"why":"The full-screen texture uses a blend mode, so the phone re-blends it against the page on every scroll frame.","fix":"Use a small pre-made PNG tile with plain opacity, or turn the texture off on touch devices.","where":["apps/web/app/globals.css:44"],"verify":"Scrolling the packing sheet on an iPad is smoother. Desktop still shows the grain.","ex":{"before":"body::before { mix-blend-mode: multiply; ... }","after":"@media (pointer: coarse) {\n  body::before { display: none; }\n}"}},{"id":"derived-effect","group":3,"title":"New store form: work values out directly instead of resetting them afterwards","effort":"Small change","tags":["speed"],"why":"Changing size or type draws the form once with old values, then again after a follow-up reset. Two draws where one would do.","fix":"Reset the basket and ranging during the render that sees the new size, type or proposed ranging, using React's adjust-state-when-a-prop-changes form (`if (seen !== context) { setSeen(context); setBasket(...); }`), and delete the `useEffect`. That is what a `key` on a child section would do, without moving the basket, ranging and their handlers into a child component; only use `key` if the basket already lives in its own component.","where":["apps/web/components/NewStoreSetup.tsx:227"],"verify":"Changing the store size still updates the suggested basket.","ex":{"before":"useEffect(() => { setBasket(auto); }, [size, type]);\n// draws once with the old basket, then again","after":"const ctx = `${size}|${type}`;\nconst [seen, setSeen] = useState(ctx);\nif (seen !== ctx) { setSeen(ctx); setBasket(auto); }\n// React restarts this render before anything is drawn"}},{"id":"camera-leak","group":4,"title":"Camera can stay on after tapping ✕ too quickly","effort":"Small change","tags":["data"],"why":"If the driver closes the camera while it is still starting, the camera stream arrives after the close and is never stopped until the next photo.","fix":"Set a \"cancelled\" flag before waiting for the camera, and stop the stream immediately if the camera screen is already gone.","where":["apps/web/components/DriverApp.tsx:239"],"verify":"Open the camera and close it instantly. The camera light goes off.","ex":{"before":"const stream = await getUserMedia(...);\nstreamRef.current = stream;","after":"const stream = await getUserMedia(...);\nif (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }\nstreamRef.current = stream;"}},{"id":"ask-race","group":4,"title":"Two quick clicks in the Ask bar can show the older answer","effort":"Small change","tags":["speed"],"why":"Requests are not cancelled, so whichever finishes last wins.","fix":"Cancel the previous request when a new one starts, or disable the buttons while loading.","where":["apps/web/components/AskBar.tsx:27"],"verify":"Click two different chips quickly. The answer matches the second click.","ex":{"before":"fetch(\"/api/ask\", { body });","after":"ctrl.current?.abort();\nctrl.current = new AbortController();\nfetch(\"/api/ask\", { body, signal: ctrl.current.signal });"}},{"id":"feed-gaps","group":4,"title":"Feed gaps query gets slower as sales grow","effort":"Small change","tags":["speed"],"why":"It finds the list of retailers by scanning every sales row, which is over a million today.","fix":"Read the retailer list from the retailer type instead of scanning sales. This is a query change, not a database change.","where":["apps/web/lib/queries.ts:961"],"verify":"The feeds page shows the same gaps.","ex":{"before":"r as (select distinct source from sales_daily)","after":"r as (select unnest(enum_range(null::retailer_type)) as source)"}},{"id":"coles-memory","group":4,"title":"Very large Coles files use a lot of memory","effort":"Medium change","tags":["cost"],"why":"Every row is rebuilt as a spreadsheet-library object while reading, which is why there is a 15 MB file cap.","fix":"Keep rows as plain arrays of values. The parser only ever reads the value.","where":["apps/web/lib/feeds/coles.ts:272"],"verify":"`npx tsx scripts/coles-parser-check.ts` passes. Run it on the unchanged code first: on Node 22.23.1 and Node 24 the exceljs streaming reader throws before parsing, even on an untouched checkout. If it fails before any change, this card is blocked until Node is pinned to a version where the check passes; do not start it while the check fails on the unchanged code.","ex":{"before":"rows.push(worksheet.getRow(n)); // heavy object","after":"rows.push(row.values);          // plain array"}},{"id":"harris-backfill","group":4,"title":"Harris Farm backfills fetch one week at a time","effort":"Small change","tags":["speed"],"why":"Only matters when asking for many weeks at once.","fix":"Download the files together, then load them in order.","where":["apps/web/app/api/feeds/harris-farm-pull/route.ts:124"],"verify":"A 4-week pull loads the same rows as before.","ex":{"before":"for (const w of weeks) {\n  const csv = await fetchWeek(w);\n  await ingest(csv);\n}","after":"const csvs = await Promise.all(weeks.map(fetchWeek));\nfor (const csv of csvs) await ingest(csv);"}},{"id":"demo-tour","group":4,"title":"Demo tour keeps checking the page after you navigate away","effort":"Small change","tags":["speed"],"why":"Demo build only. The element checker is not tracked, so it can keep running for 12 seconds.","fix":"Keep the timer handle and cancel it in the cleanup.","where":["apps/web/components/DemoTour.tsx:142"],"verify":"Demo build only: start the tour, navigate away, no stray highlights appear.","ex":{"before":"const iv = setInterval(check, 120); // never cleared on unmount","after":"timers.push(setInterval(check, 120));\n// cleanup: timers.forEach(clearInterval)"}},{"id":"graph-batch","group":4,"title":"Mailbox polling could batch its calls","effort":"Small change","tags":["cost"],"why":"One call per candidate email. Only noticeable on a large backfill.","fix":"Use Microsoft Graph's batch endpoint, up to 20 per call.","where":["apps/web/lib/feeds/graph.ts:251"],"verify":"The mail poll still finds and loads new attachments.","ex":{"before":"for (const m of messages) await listAttachments(m.id);","after":"await graphBatch(messages.map(m => attachmentsRequest(m.id)));"}},{"id":"park-matview","group":5,"title":"Precompute the store table inside the database","effort":"Medium change","tags":["speed","cost"],"why":"The Phase 1 cache reuses the table on the app side. A materialised view would do the same inside the database and refresh it from the nightly job. It is a schema change, so parked.","fix":"Only with an explicit yes from the project owner: a materialised view refreshed after each feed load, plus a migration and a rollback plan.","where":["db/migrations/050_asof_as_a_constant.sql:77"],"verify":"Numbers on the Overview match the old view exactly after a refresh.","ex":{"before":"create view v_store_week as ...","after":"create materialized view mv_store_week as ...;\n-- nightly: refresh materialized view concurrently mv_store_week"}},{"id":"park-photo","group":5,"title":"Store photos in file storage instead of the database","effort":"Medium change","tags":["speed","cost"],"why":"Photos are stored as text in a database column. Moving them to Supabase Storage would make reads lighter, but it changes where data lives. The Phase 1 photo card gets most of the benefit without that.","fix":"Only with an explicit yes from the project owner: upload to a storage bucket and keep only the URL in the column, with a one-off migration of existing photos.","where":["apps/web/app/store/actions.ts:172"],"verify":"Existing store photos still show after the migration.","ex":{"before":"update store_settings set photo_url = ${base64}","after":"await storage.upload(path, file);\nupdate store_settings set photo_url = ${publicUrl}"}},{"id":"park-indexes","group":5,"title":"Extra indexes if these tables grow","effort":"Small change","tags":["speed"],"why":"Three lookups have no index. The tables are small enough today that it does not matter. Adding an index is a database change, so parked.","fix":"Only with an explicit yes from the project owner, and only when the tables pass a few thousand rows.","where":["db/migrations/033_engine_nightly_run.sql:68","db/migrations/001_init.sql:226"],"verify":"Query plans use the new index; nothing else changes.","ex":{"before":"-- store_reco has an index on store_id only","after":"create index on store_reco (product_id);"}}],"GLOSSARY":[["Trip to the database","One request from the app server to the database and back. The two live in different places, so each trip is about 0.13 seconds. Fewer trips is the biggest speed lever in this app."],["Bundle (transaction)","A group of database statements sent together that either all succeed or all fail. `withUser()` in `lib/db.ts` opens one bundle per page request."],["Cache","Keep a result and reuse it instead of working it out again. React `cache()` reuses within one page load. `unstable_cache` reuses across visits for a set time. Both live in the app, not the database."],["Claims-as-argument recipe","How every `unstable_cache` in this app must be written. The cached function cannot read cookies, and the database only returns rows for a signed-in user, so the page passes the session claims in as an argument and the cached function runs its query with `runAsUser(claims, …)`. The cache is then per person, which is fine for about 40 users."],["useMemo","A React hook that remembers a calculation until its inputs change, so it is not redone on every click."],["memo()","Wraps a small component so it only redraws when its own inputs change, not every time its parent redraws."],["useDeferredValue","Lets the search box update instantly while the filtered list catches up a moment later, so typing never stutters."],["React Compiler","A build step that adds `useMemo` and `memo` for you. Turned on with two lines in `next.config.ts`."],["Wait, then save once","Also called debouncing. Instead of saving on every tap, wait until the taps stop for a moment and save the final result once."],["Outbox","A list of changes saved on the device that still need to reach the server. Resent when the connection is back."],["content-visibility","A CSS rule that tells the browser to skip drawing rows that are off screen."],["Packing and driver screens","The tablet and phone screens used in the bakery and on the road: Packing, Driver, Production, Deliveries."]]}</script>
<script id="state" type="application/json">{}</script>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script id="boot">
(function(){
  // The cards, phases and glossary come from the #data block. It is generated
  // from gen/items.js, the same source that produces PERFORMANCE-FIXES.md,
  // so this page and the markdown file always say the same thing.
  var D = JSON.parse(document.getElementById("data").textContent);
  var META = D.META, GROUPS = D.GROUPS, ITEMS = D.ITEMS, GLOSSARY = D.GLOSSARY;

  var state = {};
  try { state = JSON.parse(document.getElementById("state").textContent || "{}") || {}; } catch (e) { state = {}; }
  var LS_KEY = "jb-perf-local";
  var local = {};
  try { local = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) { local = {}; }
  var mode = "pending", artifactNs = null;

  function st(id){ return (state[id] && state[id].s) || (local[id] && local[id].s) || "todo"; }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  // `code` spans in prose: backticks -> <code>
  function md(s){ return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }

  var STATUS = [["todo","To do",""],["doing","Doing","sdoing"],["done","Done","sdone"],["skip","Skip",""]];
  function whereHtml(w){
    return '<div class="where">' + w.map(function(p){
      var m = p.match(/^(.*?)(:\d+)?$/);
      return '<code>' + esc(m[1]) + (m[2] ? '<b>' + m[2] + '</b>' : '') + '</code>';
    }).join("") + '</div>';
  }
  function tagHtml(t){
    var map = {speed:["t-speed","Makes it faster"], data:["t-data","Stops lost work"], cost:["t-cost","Costs less to run"]};
    var x = map[t]; return x ? '<span class="tag '+x[0]+'">'+x[1]+'</span>' : '';
  }
  function itemHtml(it, idx){
    var s = st(it.id);
    return '<article class="item '+s+'" id="c-'+it.id+'" data-id="'+it.id+'">' +
      '<div class="ih"><div class="no">'+idx+'</div><div class="it"><h3>'+esc(it.title)+'</h3>' +
      '<div class="tags"><span class="tag t-eff">'+esc(it.effort)+'</span>'+it.tags.map(tagHtml).join("")+'</div></div>' +
      '<div class="st" role="group" aria-label="Status">' + STATUS.map(function(x){
        return '<button type="button" class="'+x[2]+'" data-set="'+x[0]+'" aria-pressed="'+(s===x[0])+'">'+x[1]+'</button>';
      }).join("") + '</div></div>' +
      '<div class="ib"><div class="kv">' +
      '<b>Problem</b><p>'+md(it.why)+'</p>' +
      '<b>Fix</b><p>'+md(it.fix)+'</p>' +
      '<b>Where</b>'+whereHtml(it.where) +
      '<b>Check</b><p>'+md(it.verify)+'</p>' +
      '<b>Example</b><div><div class="ex"><div class="before"><span>Before</span><pre>'+esc(it.ex.before)+'</pre></div><div class="after"><span>After</span><pre>'+esc(it.ex.after)+'</pre></div></div><div class="exnote">Made-up snippet showing the shape of the change. Not real code from the repo.</div></div>' +
      '</div></div></article>';
  }
  function counts(list){
    var c = {todo:0,doing:0,done:0,skip:0};
    list.forEach(function(it){ c[st(it.id)]++; });
    return c;
  }
  function progressHtml(cls){
    var c = counts(ITEMS), total = ITEMS.length;
    var pct = function(n){ return (100*n/total).toFixed(1)+'%'; };
    return '<div class="mini '+(cls||'')+'"><div class="big">'+c.done+'<small>of '+total+' done</small></div>' +
      '<div class="bar"><i class="d" style="width:'+pct(c.done)+'"></i><i class="g" style="width:'+pct(c.doing)+'"></i><i class="k2" style="width:'+pct(c.skip)+'"></i></div>' +
      '<div class="saved" id="savedline"></div></div>';
  }
  function render(){
    var html = '<div class="frame"><aside class="side" aria-label="Contents">' +
      '<p class="brand">Jesse’s Bakery OS</p>' + progressHtml('m') +
      '<p class="k">Contents</p><ol>' +
      '<li><a href="#start"><span class="n">·</span><span class="t">How to use this</span></a></li>';
    GROUPS.forEach(function(g){
      var all = ITEMS.filter(function(it){ return it.group === g.n; });
      var d = all.filter(function(it){ return st(it.id) === "done"; }).length;
      html += '<li><a href="#'+g.key+'" class="'+(g.optional?'opt':'')+'"><span class="n">'+g.n+'</span><span class="t">'+esc(g.title === "Parked" ? "Parked" : g.sub)+'</span><span class="c">'+d+'/'+all.length+'</span></a></li>';
    });
    html += '<li><a href="#agent"><span class="n">·</span><span class="t">For your AI agent</span></a></li>' +
      '<li><a href="#glossary"><span class="n">·</span><span class="t">Words used here</span></a></li></ol>' +
      progressHtml('') + '</aside><main class="main">';

    html += '<header class="mast"><p class="kicker">Code review · ' + esc(META.date) + ' · nothing changed yet</p>' +
      '<h1>' + esc(META.title) + '</h1>' +
      '<p class="stand">' + ITEMS.length + ' changes that make the app faster, keep work from being lost, or cost less to run. Grouped into phases, plain words, one fix per card.</p>' +
      '<div class="dateline"><span>Branch <b>' + esc(META.branch) + '</b></span><span>Full audit <b>' + esc(META.auditFile) + '</b></span><span>Agent plan <b>' + esc(META.planFile) + '</b></span></div></header>';

    html += '<section class="sec" id="start"><h2>How to use this</h2>' +
      '<ol><li>Start with <b>Phase 1</b> and work down in order. Phases 1 to 3 are the plan.</li>' +
      '<li>Each card has a <b>Problem</b>, a <b>Fix</b>, a <b>Where</b> (file and line number), a <b>Check</b> to prove it worked, and a made-up <b>Before / After</b> example that shows the shape of the change.</li>' +
      '<li>Click <b>Doing</b> when you pick a card up and <b>Done</b> when it is merged. Clicks are saved for everyone who opens this link.</li>' +
      '<li>Click <b>Skip</b> if the project owner decides not to do one.</li>' +
      '<li><b>Phase 4</b> and <b>Parked</b> are optional. Do not start them without asking the project owner first. The page and the agent plan both stop you there.</li></ol>' +
      '<div class="callout"><h3>Nothing here changes the database</h3><p>Every card in Phases 1 to 3 is an app-side change. The only database ideas are in the Parked group at the bottom, marked optional, and each one needs an explicit yes before anyone touches it.</p></div></section>';

    var idx = 0;
    GROUPS.forEach(function(g){
      var all = ITEMS.filter(function(it){ return it.group === g.n; });
      var d = all.filter(function(it){ return st(it.id) === "done"; }).length;
      html += '<section class="phase p'+g.n+'" id="'+g.key+'"><div class="ph"><div class="num">'+g.n+'</div><div class="txt"><h2>'+esc(g.title)+'</h2><p class="sub">'+esc(g.sub)+'</p><div class="cnt">'+d+' of '+all.length+' done</div></div></div>' +
        '<p class="pd">'+esc(g.desc)+'</p>';
      if (g.optional) {
        html += '<div class="gate"><h3>Before you continue: ask the project owner</h3><p>'+esc(g.gate)+'</p><p><b>If you are an AI agent working from this plan, stop here and ask the person you are working with before doing anything in this group.</b></p></div>';
      }
      all.forEach(function(it){ idx++; html += itemHtml(it, idx); });
      html += '</section>';
    });

    html += '<section class="sec" id="agent"><h2>For your AI agent</h2>' +
      '<p>Give your coding agent the plan file, not this page. The plan says the same thing as these cards, in the same order, with the same file and line numbers, and includes the stop-and-ask rule before the optional groups.</p>' +
      '<dl class="filelist"><dt>' + esc(META.planFile) + '</dt><dd>The card list for the agent. Each card has a checkbox the agent ticks when done.</dd>' +
      '<dt>' + esc(META.skillFile) + '</dt><dd>A skill the agent loads with <code>/perf-fixes</code>. It tells the agent how to work the plan one card at a time, verify, and stop before Phase 4.</dd>' +
      '<dt>' + esc(META.rulesFile) + '</dt><dd>Project rules every agent and person follows, so these problems are not reintroduced after they are fixed.</dd>' +
      '<dt>' + esc(META.auditFile) + '</dt><dd>The long technical audit, for anyone who wants every line.</dd></dl>' +
      '<div class="callout" style="margin-top:18px"><h3>One-line prompt to start</h3><p><code>/perf-fixes</code> — or: “Read PERFORMANCE-FIXES.md and do the next unchecked card in Phase 1. Verify it, tick it, then stop and show me the diff.”</p></div></section>';

    html += '<section class="sec gl" id="glossary"><h2>Words used here</h2><dl>' + GLOSSARY.map(function(g){ return '<dt>'+esc(g[0])+'</dt><dd>'+md(g[1])+'</dd>'; }).join("") + '</dl></section>';
    html += '<p class="foot">Order was set by measured cost: trips to the database per page, work per click, and what happens when a request fails. This page and ' + esc(META.planFile) + ' are generated from one list, so they always match.</p>';
    html += '</main></div>';
    document.getElementById("app").innerHTML = html;
    savedLine(); watchSections();
  }
  function savedLine(){
    document.querySelectorAll("#savedline, .saved").forEach(function(el){
      if (mode === "shared") el.textContent = "Status saves for everyone with this link.";
      else if (mode === "local") el.textContent = "Read-only copy: status kept on this device only.";
      else el.textContent = "Connecting…";
    });
  }
  var io = null;
  function watchSections(){
    if (io) io.disconnect();
    var links = {}; document.querySelectorAll(".side li a").forEach(function(a){ links[a.getAttribute("href").slice(1)] = a; });
    if (!("IntersectionObserver" in window)) return;
    io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting) {
          Object.keys(links).forEach(function(k){ links[k].classList.remove("on"); });
          var a = links[en.target.id]; if (a) a.classList.add("on");
        }
      });
    }, { rootMargin: "-10% 0px -75% 0px", threshold: 0 });
    document.querySelectorAll(".sec, .phase").forEach(function(s){ io.observe(s); });
  }
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 2200);
  }

  // ---------- the page saves itself ----------
  function buildDoc(nextState){
    var css = document.getElementById("css").textContent;
    var js = document.getElementById("boot").textContent;
    var data = document.getElementById("data").textContent;
    var json = JSON.stringify(nextState).replace(/<\//g, "<\\/");
    return '<!doctype html>\n<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>Jesse’s Bakery OS Performance Fixes</title>' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">' +
      '<style id="css">' + css + '</style></head><body>' +
      '<script id="data" type="application/json">' + data + '<\/script>' +
      '<script id="state" type="application/json">' + json + '<\/script>' +
      '<div id="app"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>' +
      '<script id="boot">' + js + '<\/script></body></html>';
  }
  var saving = false;
  function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(local)); } catch (e) {} }
  function commit(id, s){
    var cur = { s: s };
    if (mode === "local" || !artifactNs) { local[id] = cur; saveLocal(); render(); toast("Saved on this device"); return; }
    var next = JSON.parse(JSON.stringify(state)); next[id] = cur;
    state = next; render();
    if (saving) return;
    saving = true;
    artifactNs.publish(buildDoc(next)).then(function(){ toast("Saved for everyone"); }).catch(function(err){
      saving = false;
      var code = err && err.code;
      if (code === "conflict") return;
      if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "capability_disabled") {
        mode = "local"; local[id] = cur; saveLocal(); render(); toast("Read-only copy: saved on this device"); return;
      }
      if (code === "rate_limited") { toast("Saving too fast, try again in a moment"); return; }
      toast("Could not save: " + (err && err.message ? err.message : "unknown error"));
    });
  }
  document.getElementById("app").addEventListener("click", function(e){
    var b = e.target.closest("button[data-set]"); if (!b) return;
    var card = b.closest(".item"); if (!card) return;
    var id = card.dataset.id;
    if (st(id) !== b.dataset.set) commit(id, b.dataset.set);
  });

  render();
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function(ns){
      mode = ns ? "shared" : "local"; if (ns) artifactNs = ns;
      savedLine();
    });
  } else { mode = "local"; savedLine(); }
})();
</script>
